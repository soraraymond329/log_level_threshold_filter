[project]
name = "log-level-threshold-filter"
version = "0.1.3"
description = "A filter that applies min/max level bounds so handlers can accept only records between WARNING and ERROR, excluding DEBUG and CRITICAL."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
